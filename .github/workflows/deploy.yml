
name: Build and Deploy Finance

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build Spring Boot application
        run: chmod +x mvnw && ./mvnw -B clean package -DskipTests

      - name: Prepare executable JAR
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(
            find target -maxdepth 1 -type f -name '*.jar' \
              ! -name '*.original' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar'
          )
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one application JAR; found ${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi
          cp "${jars[0]}" target/app.jar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-app
          path: target/app.jar
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: finance-app
          path: dist

      - name: Configure SSH
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload application JAR
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 \
            -P "$SERVER_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            dist/app.jar \
            "$SERVER_USER@$SERVER_HOST:/www/wwwroot/finance/app.jar"

      - name: Restart Finance service
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 \
            -p "$SERVER_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" \
            'sudo /usr/bin/systemctl restart finance &&
             sleep 3 &&
             sudo /usr/bin/systemctl is-active finance'
